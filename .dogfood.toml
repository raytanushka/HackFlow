[portal]
base_url = "http://localhost:8000"

[tiers]
claimed = ["T1", "T2"]
pitch = "HackFlow judging and hackathon management platform"

[auth]
organizer   = "Cookie: session=session_org_hackflow_2026_token"
participant = "Cookie: session=session_prt_hackflow_2026_token"
judge_a     = "Cookie: session=session_jdg_a_hackflow_2026_token"
judge_b     = "Cookie: session=session_jdg_b_hackflow_2026_token"

[routes]
gallery      = "/projects"
submit       = "/api/events/evt_01/projects"
csv_export   = "/api/export.csv"
judge_scores = "/api/judge/scores"
peer_scores  = "/api/judge/scores?judge=judge_a"