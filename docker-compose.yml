version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hackflow-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackflow_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-hackflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackflow_user} -d ${POSTGRES_DB:-hackflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hackflow-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hackflow_user}:${POSTGRES_PASSWORD:-hackflow_secret_password}@db:5432/${POSTGRES_DB:-hackflow_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackflow-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
