services:
  backend:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_FILE: /app/data/hackflow.db
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - hackflow_data:/app/data
    command: ["sh", "-c", "npm run seed && npm start"]

volumes:
  hackflow_data:
